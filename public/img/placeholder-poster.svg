<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="250" cy="270" r="180" fill="url(#glow)" />
  
  <!-- Film slate icon -->
  <g transform="translate(185, 200)">
    <rect x="0" y="30" width="130" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Clapper top -->
    <path d="M 0 30 L 130 30 L 120 5 L -10 5 Z" fill="#334155" />
    <path d="M 15 5 L 30 30" stroke="#f1f5f9" stroke-width="7" />
    <path d="M 50 5 L 65 30" stroke="#f1f5f9" stroke-width="7" />
    <path d="M 85 5 L 100 30" stroke="#f1f5f9" stroke-width="7" />
    <!-- Reel / Play symbol inside -->
    <circle cx="65" cy="78" r="22" fill="#0f172a" stroke="url(#accent)" stroke-width="3" />
    <polygon points="60,68 75,78 60,88" fill="url(#accent)" />
  </g>
  
  <!-- Decorative stars -->
  <g fill="#f59e0b">
    <polygon points="250,370 254,380 265,380 256,386 259,396 250,390 241,396 244,386 235,380 246,380" transform="scale(0.8) translate(65, 80)" />
  </g>
  
  <!-- Texts -->
  <text x="250" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">
    CINEVERSE
  </text>
  <text x="250" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    PREVIEW NOT AVAILABLE
  </text>
</svg>

